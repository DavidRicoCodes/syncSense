schema_version: 1.0.0
profile_id: wifi_bf_like
profile_version: 2.0.0
experiment_type: wifi_bf_like
description: Definitive HE NDP-like 40 MHz BF smoke with eight HE-LTF channel estimates per packet.

parameters:
  label: {type: string, required: true}
  num_packets: {type: integer, required: true, minimum: 1, maximum: 10000}
  bf_period_ms: {type: number, required: false, default: 100, minimum: 10, maximum: 1000}
  bf_detector_threshold: {type: number, required: false, default: 0.90, minimum: 0, maximum: 1}
  bf_rx_gain_db: {type: number, required: false, default: 60, minimum: 0, maximum: 80}
  bf_tx_gain_db: {type: number, required: false, default: 65, minimum: 0, maximum: 80}
  bf_tx_amplitude: {type: number, required: false, default: 0.80, minimum: 0.01, maximum: 1}
  minimum_bf_reception_ratio: {type: number, required: false, default: 0.80, minimum: 0, maximum: 1}
  rx_quiet_s: {type: number, required: false, default: 2, minimum: 0.1, maximum: 30}
  rx_max_drain_s: {type: number, required: false, default: 10, minimum: 1, maximum: 60}

clock_domains:
  - clock_domain_id: pc2_wifi_bf_acquisition
    owner_node_id: pc2
    kind: acquisition
    epoch: local_device_epoch
    comparability_group: wifi_bf_like

clock_relationships: []

processes:
  - producer_id: rx_wifi
    node_id: pc2
    role: receiver
    modality: wifi
    command_ref: wifi_bf_like_rx
    lifecycle: continuous
    clock_domain_id: pc2_wifi_bf_acquisition
    readiness:
      type: stdout_regex
      pattern: "STATUS \\| rate=(?:19(?:\\.[0-9]+)?|[2-9][0-9](?:\\.[0-9]+)?) Msps"
    timeouts: {readiness_s: 30, stop_grace_s: 8, kill_s: 2}
    expected_artifacts:
      - {artifact_id: rx_wifi_features, artifact_type: wifi_he_ltf_feature_rows, media_type: application/x-ndjson, path: features.jsonl, required: true}
      - {artifact_id: rx_wifi_csi, artifact_type: wifi_he_ltf_cf32, media_type: application/octet-stream, path: csi.cf32, required: true}
      - {artifact_id: rx_wifi_frame_timings, artifact_type: wifi_frame_timing_rows, media_type: application/x-ndjson, path: frame-timings.jsonl, required: true}
      - {artifact_id: rx_wifi_block_timings, artifact_type: wifi_block_timing_rows, media_type: application/x-ndjson, path: block-timings.jsonl, required: true}
      - {artifact_id: rx_wifi_log, artifact_type: process_log, media_type: text/plain, path: process.log, required: true}
      - {artifact_id: rx_wifi_receipt, artifact_type: producer_result, media_type: application/json, path: producer-result.json, required: true}

  - producer_id: tx_wifi
    node_id: pc3pc4
    role: transmitter
    modality: wifi
    command_ref: wifi_bf_like_n310_tx
    lifecycle: finite
    readiness: {type: process_running, grace_s: 0}
    timeouts: {readiness_s: 15, stop_grace_s: 5, kill_s: 2}
    expected_artifacts:
      - {artifact_id: tx_wifi_state, artifact_type: n310_he_ndp_like_tx_state, media_type: application/json, path: state.json, required: true}
      - {artifact_id: tx_wifi_first_packet, artifact_type: wifi_he_ndp_like_first_packet_npz, media_type: application/octet-stream, path: first-packet.npz, required: true}
      - {artifact_id: tx_wifi_log, artifact_type: process_log, media_type: text/plain, path: process.log, required: true}
      - {artifact_id: tx_wifi_receipt, artifact_type: producer_result, media_type: application/json, path: producer-result.json, required: true}

orchestration:
  start_groups:
    - [rx_wifi]
    - [tx_wifi]
  stop_groups:
    - [tx_wifi]
    - [rx_wifi]
  monitor_interval_s: 0.25
  heartbeat_interval_s: 1.0
  supervisor_stale_s: 5.0
  completion:
    finite_producer_id: tx_wifi
    quiet_artifact: rx_wifi/features.jsonl
    quiet_s_parameter: rx_quiet_s
    max_drain_s_parameter: rx_max_drain_s
