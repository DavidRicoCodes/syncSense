schema_version: 1.0.0
profile_id: nosync_passive
profile_version: 2.0.0
experiment_type: nosync_passive
description: Real passive 5G/WiFi capture with separated receivers and no common acquisition reference.
parameters:
  label: {type: string, required: true}
  position: {type: string, required: true}
  testbed_id: {type: string, required: false, default: testbed1, enum: [testbed1]}
  condition: {type: string, required: false, default: occupied_static, enum: [empty, occupied_static, occupied_moving, other]}
  subject_id: {type: string, required: false, default: anonymous}
  notes: {type: string, required: false, default: ""}
  num_beacons: {type: integer, required: false, default: 1000, minimum: 1, maximum: 10000}
  detector_threshold: {type: number, required: false, default: 0.70, minimum: 0, maximum: 1}
  wifi_rx_gain_db: {type: number, required: false, default: 60, minimum: 0, maximum: 100}
  wifi_tx_gain_db: {type: number, required: false, default: 65, minimum: 0, maximum: 100}
  wifi_tx_amplitude: {type: number, required: false, default: 0.80, minimum: 0.01, maximum: 1}
  wifi_tx_strategy: {type: string, required: false, default: timed, enum: [timed, streamed]}
  wifi_stream_batch_packets: {type: integer, required: false, default: 20, minimum: 1, maximum: 1000}
  pre_tx_guard_s: {type: number, required: false, default: 3, minimum: 0, maximum: 60}
  tx_start_delay_s: {type: number, required: false, default: 2, minimum: 0, maximum: 60}
  rx_quiet_s: {type: number, required: false, default: 2, minimum: 0.1, maximum: 30}
  rx_max_drain_s: {type: number, required: false, default: 10, minimum: 1, maximum: 60}
  minimum_wifi_reception_ratio: {type: number, required: false, default: 0.80, minimum: 0.01, maximum: 1}
  maximum_consecutive_wifi_loss: {type: integer, required: false, default: 5, minimum: 0, maximum: 10000}
  minimum_5g_valid_ratio: {type: number, required: false, default: 0.80, minimum: 0.01, maximum: 1}
  min_valid_ssb_rate_hz: {type: number, required: false, default: 10, minimum: 0.1, maximum: 100}
  maximum_pair_delta_ms: {type: number, required: false, default: 30, minimum: 0.1, maximum: 10000}
clock_domains:
  - clock_domain_id: pc1_5g_b210_acquisition
    owner_node_id: pc1
    kind: acquisition
    epoch: local_device_epoch
    comparability_group: pc1_5g_b210_only
  - clock_domain_id: pc2_wifi_b210_acquisition
    owner_node_id: pc2
    kind: acquisition
    epoch: local_device_epoch
    comparability_group: pc2_wifi_b210_only
clock_relationships:
  - left: pc1_5g_b210_acquisition
    right: pc2_wifi_b210_acquisition
    relation: not_comparable
    reason: separate_receivers_without_common_time_or_frequency_reference
processes:
  - producer_id: rx_5g
    node_id: pc1
    role: receiver
    modality: 5g
    command_ref: nosync_5g_rx
    lifecycle: continuous
    stop_signal: interrupt
    clock_domain_id: pc1_5g_b210_acquisition
    readiness: {type: stdout_regex, pattern: "^READY \\| joint_5g_hssb_parallel"}
    timeouts: {readiness_s: 90, stop_grace_s: 15, kill_s: 3}
    expected_artifacts:
      - {artifact_id: rx_5g_hssb, artifact_type: 5g_hssb_rows, media_type: application/x-ndjson, path: hssb.jsonl, required: true}
      - {artifact_id: rx_5g_rxgrid, artifact_type: 5g_rxgrid_cf32, media_type: application/octet-stream, path: rxgrid.cf32, required: true}
      - {artifact_id: rx_5g_hssb_cf32, artifact_type: 5g_hssb_cf32, media_type: application/octet-stream, path: hssb.cf32, required: true}
      - {artifact_id: rx_5g_events, artifact_type: temporal_event_index, media_type: application/x-ndjson, path: events.jsonl, required: true, event_index: true}
      - {artifact_id: rx_5g_anchors, artifact_type: host_clock_anchors, media_type: application/x-ndjson, path: host-clock-anchors.jsonl, required: true}
      - {artifact_id: rx_5g_ntp, artifact_type: ntp_status, media_type: application/json, path: ntp-status.json, required: true}
      - {artifact_id: rx_5g_log, artifact_type: process_log, media_type: text/plain, path: process.log, required: true}
      - {artifact_id: rx_5g_receipt, artifact_type: producer_result, media_type: application/json, path: producer-result.json, required: true}
  - producer_id: rx_wifi
    node_id: pc2
    role: receiver
    modality: wifi
    command_ref: nosync_wifi_rx
    lifecycle: continuous
    clock_domain_id: pc2_wifi_b210_acquisition
    readiness: {type: stdout_regex, pattern: "STATUS \\| rate=(?:19(?:\\.[0-9]+)?|[2-9][0-9](?:\\.[0-9]+)?) Msps"}
    timeouts: {readiness_s: 30, stop_grace_s: 10, kill_s: 3}
    expected_artifacts:
      - {artifact_id: rx_wifi_features, artifact_type: wifi_csi_feature_rows, media_type: application/x-ndjson, path: features.jsonl, required: true}
      - {artifact_id: rx_wifi_csi, artifact_type: wifi_csi_cf32, media_type: application/octet-stream, path: csi.cf32, required: true}
      - {artifact_id: rx_wifi_frame_timings, artifact_type: wifi_frame_timing_rows, media_type: application/x-ndjson, path: frame-timings.jsonl, required: true}
      - {artifact_id: rx_wifi_block_timings, artifact_type: wifi_block_timing_rows, media_type: application/x-ndjson, path: block-timings.jsonl, required: true}
      - {artifact_id: rx_wifi_events, artifact_type: temporal_event_index, media_type: application/x-ndjson, path: events.jsonl, required: true, event_index: true}
      - {artifact_id: rx_wifi_anchors, artifact_type: host_clock_anchors, media_type: application/x-ndjson, path: host-clock-anchors.jsonl, required: true}
      - {artifact_id: rx_wifi_ntp, artifact_type: ntp_status, media_type: application/json, path: ntp-status.json, required: true}
      - {artifact_id: rx_wifi_log, artifact_type: process_log, media_type: text/plain, path: process.log, required: true}
      - {artifact_id: rx_wifi_receipt, artifact_type: producer_result, media_type: application/json, path: producer-result.json, required: true}
  - producer_id: tx_wifi
    node_id: pc3pc4
    role: transmitter
    modality: wifi
    command_ref: nosync_n310_tx
    lifecycle: finite
    readiness: {type: process_running, grace_s: 0}
    timeouts: {readiness_s: 15, stop_grace_s: 10, kill_s: 3}
    expected_artifacts:
      - {artifact_id: tx_wifi_state, artifact_type: n310_tx_state, media_type: application/json, path: state.json, required: true}
      - {artifact_id: tx_wifi_first_packet, artifact_type: wifi_first_packet_npz, media_type: application/octet-stream, path: first-packet.npz, required: true}
      - {artifact_id: tx_wifi_log, artifact_type: process_log, media_type: text/plain, path: process.log, required: true}
      - {artifact_id: tx_wifi_receipt, artifact_type: producer_result, media_type: application/json, path: producer-result.json, required: true}
orchestration:
  start_groups:
    - [rx_5g, rx_wifi]
    - [tx_wifi]
  stop_groups:
    - [tx_wifi]
    - [rx_5g, rx_wifi]
  monitor_interval_s: 0.25
  heartbeat_interval_s: 1
  supervisor_stale_s: 5
  completion:
    finite_producer_id: tx_wifi
    quiet_artifact: rx_wifi/features.jsonl
    quiet_s_parameter: rx_quiet_s
    max_drain_s_parameter: rx_max_drain_s
